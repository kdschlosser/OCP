name: Generate sources and compile

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      runner_generate:
        required: true
        type: string
      runner_compile:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      ANACONDA_TOKEN:
        required: false

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  # Run pywrap and generate sources
  generate:
    name: Generate ${{ inputs.name }}
    runs-on: ${{ inputs.runner_generate }}
    timeout-minutes: 360
    outputs:
      output_dir: ${{ steps.conf.outputs.OUTPUT }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read output dir
        id: conf
        run: |
          OUTPUT=$(grep '^output_folder' ocp.toml | sed -E 's/output_folder *= *"(.*)"/\1/')
          echo "OUTPUT=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Cache generated bindings
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.conf.outputs.OUTPUT }}
            ${{ steps.conf.outputs.OUTPUT }}_pkl
          key: ocp-src-${{ inputs.platform }}-${{ hashFiles('opencascade/**', 'ocp.toml', 'CMakeLists.txt', 'templates/**', 'OCP_specific.inc', 'pystreambuf.h', 'dump_symbols.py', 'environment.devenv.yml', 'pywrap/**') }}

      - uses: ./.github/actions/micromamba
        if: steps.cache-src.outputs.cache-hit != 'true'

      - name: SDK install and symlink (Mac)
        if: steps.cache-src.outputs.cache-hit != 'true' && inputs.platform == 'OSX'
        run: |
          curl -L -O https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
          sudo mkdir -p /opt
          sudo tar -xf MacOSX11.3.sdk.tar.xz -C /opt
          sudo mkdir -p /opt/usr/local/
          sudo ln -s /opt/MacOSX11.3.sdk/usr/include /opt/usr/local/include
          sudo mkdir -p /usr/local/include
          sudo ln -s /opt/MacOSX11.3.sdk/System/Library/Frameworks/OpenGL.framework/Headers /usr/local/include/OpenGL

      - name: install conda-devenv
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: micromamba install mamba conda-devenv

      - name: Prepare conda environment (mamba-devenv)
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          export CONDA_DEVENV_ENV_MANAGER=mamba
          micromamba create -n bindgen -y
          env
          micromamba run mamba info
          micromamba run mamba-devenv -f environment.devenv.yml

      - name: Generate (Windows on Linux)
        if: steps.cache-src.outputs.cache-hit != 'true' && inputs.platform == 'Windows'
        run: |
          micromamba create --yes --platform win-64 --no-deps --prefix ./occt "occt=8.0.0=novtk*"
          micromamba run -n bindgen cmake -S . -B . -G Ninja \
            -DPython_ROOT_DIR=$CONDA_PREFIX \
            -DPython3_ROOT_DIR=$CONDA_PREFIX \
            -DPython_FIND_VIRTUALENV=ONLY \
            -DPython3_FIND_VIRTUALENV=ONLY \
            -DOCCT_LIB_DIR=./occt/Library/bin/ \
            -DPLATFORM=Windows
          cmake --build . -- -v
          ls -lRht

      - name: Generate (Standard)
        if: steps.cache-src.outputs.cache-hit != 'true' && inputs.platform != 'Windows'
        run: |
          micromamba run -n bindgen cmake -S . -B . -G Ninja \
            -DPython_ROOT_DIR=$CONDA_PREFIX \
            -DPython3_ROOT_DIR=$CONDA_PREFIX \
            -DPython_FIND_VIRTUALENV=ONLY \
            -DPython3_FIND_VIRTUALENV=ONLY
          cmake --build .
          ls -lRht

      - name: Copy pkl output
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ steps.conf.outputs.OUTPUT }}_pkl
          cp *.pkl ${{ steps.conf.outputs.OUTPUT }}_pkl/
          cp *.dat ${{ steps.conf.outputs.OUTPUT }}_pkl/

      - name: Upload Sources
        uses: actions/upload-artifact@v7
        with:
          name: OCP_src_${{ inputs.platform }}
          path: ${{ steps.conf.outputs.OUTPUT }}

      - name: Upload Pickles
        uses: actions/upload-artifact@v7
        with:
          name: OCP_pkl_${{ inputs.platform }}
          path: ${{ steps.conf.outputs.OUTPUT }}_pkl

  # Compile
  compile:
    needs: generate
    name: Compile ${{ inputs.name }} (3.${{ matrix.py_min }})
    runs-on: ${{ inputs.runner_compile }}
    strategy:
      fail-fast: false
      matrix:
        py_min: ['14t']

    env:
      OCP_src: OCP_src_${{ inputs.platform }}
      n_cores: 2
      PYTHON_VERSION: 3.${{ matrix.py_min }}
      STAGE: "compile"
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prefer Git Bash over WSL's bash.exe (self-hosted Windows runners)
        if: inputs.platform == 'Windows'
        shell: powershell
        run: |
          if (Test-Path "C:\Program Files\Git\bin\bash.exe") {
            "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Download Source Artifact
        uses: actions/download-artifact@v8
        with:
          name: OCP_src_${{ inputs.platform }}
          path: ../${{ env.OCP_src }}

      - name: Set up Python 3.14t (free-threaded)
        if: matrix.py_min == '14t'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Resolve free-threaded python executable path
        if: matrix.py_min == '14t'
        run: |
          if [ "${{ inputs.platform }}" == "Windows" ]; then
            # Don't assume the exe is named python.exe vs python3.14t.exe -
            # find whatever the real free-threaded interpreter binary is
            # (excluding the windowed pythonw-style variant).
            PYDIR="${pythonLocation//\\//}"
            PY=$(ls "$PYDIR"/python*.exe 2>/dev/null | grep -v 'w\.exe$' | head -n1)
          else
            PY="$pythonLocation/bin/python3"
          fi
          echo "Resolved free-threaded interpreter: $PY"
          "$PY" -c "import sys; print(sys.version); print('GIL disabled build:', not sys._is_gil_enabled())"
          echo "PY314T=$PY" >> "$GITHUB_ENV"

      - name: Install pybind11 3.x and test/stub deps into 3.14t
        if: matrix.py_min == '14t'
        run: |
          "$PY314T" -m pip install --upgrade pip
          "$PY314T" -m pip install "pybind11>=3.0.2" pytest git+https://github.com/CadQuery/pybind11-stubgen.git

      - uses: ./.github/actions/micromamba

      - name: install conda-devenv
        run: micromamba install mamba conda-devenv

      - name: Prepare conda environment (mamba-devenv)
        run: |
          export CONDA_DEVENV_ENV_MANAGER=mamba
          micromamba create -n bindgen -y
          micromamba run mamba-devenv -f environment.devenv.yml

          # Steps below that invoke $PY314T directly (not wrapped in
          # 'micromamba run -n bindgen ...') don't get the conda env's own
          # PATH additions - on Windows, that means OCCT's TKxxx.dll,
          # fmt.dll, tbb.dll etc. (in Library\bin) aren't found when
          # importing OCP, since Windows resolves a DLL's own dependencies
          # via PATH at runtime with no rpath-equivalent (unlike the .so
          # files on Linux/macOS, which conda-forge's toolchain bakes an
          # RPATH into at link time). Capture the env's real prefix once so
          # those later steps can add the right directory themselves.
          # Route through Git Bash on every platform (not "cmd /c echo
          # %CONDA_PREFIX%" on Windows) - that cmd invocation was observed
          # to leak its own prompt string ("(bindgen) D:\...\OCP>", from
          # micromamba's env-activation PROMPT prefix) into stdout after
          # the real value, which "take the last line" doesn't protect
          # against since the noise can trail the value too, not just lead
          # it. bash -c 'echo $CONDA_PREFIX' doesn't have that problem.
          CONDA_BINDGEN_PREFIX=$(micromamba run -n bindgen bash -c 'echo $CONDA_PREFIX' | grep -v '^$' | tail -n 1)
          echo "CONDA_BINDGEN_PREFIX=$CONDA_BINDGEN_PREFIX" >> "$GITHUB_ENV"

          if [ "${{ inputs.platform }}" == "Windows" ]; then
            # Generate stubs/Test Import/Run tests (further down, all
            # later steps in this job) invoke $PY314T directly, bypassing
            # 'micromamba run -n bindgen ...'s own PATH setup - without
            # OCCT's/fmt's/tbb's DLL directory on PATH, importing OCP
            # fails at runtime (Windows resolves a DLL's own dependencies
            # via PATH, no rpath-equivalent). $GITHUB_PATH only takes
            # effect starting the step AFTER the one that writes it
            # (never the same step), so registering it here - before any
            # of those steps run - covers all of them without repeating
            # the same PATH edit in each one.
            #
            # Bash's PATH is colon-separated, and a raw "C:\foo" would be
            # misparsed right at the drive-letter colon - convert to Git
            # Bash's POSIX form ("/c/foo") first.
            CONDA_BINDGEN_LIBDIR=$(cygpath -u "$CONDA_BINDGEN_PREFIX/Library/bin")
            echo "$CONDA_BINDGEN_LIBDIR" >> "$GITHUB_PATH"
          fi

      - name: Compile (Ubuntu)
        if: inputs.platform == 'Linux'
        run: |
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            PYBIND11_DIR=$("$PY314T" -c "import pybind11; print(pybind11.get_cmake_dir())")
            # Not required on Linux today (its ./configure-built pyconfig.h
            # already bakes this in unconditionally for a free-threaded
            # build - confirmed working without it), but harmless if
            # redundant (redefining a macro to its existing value isn't an
            # error) and guards against CPython changing that in the
            # future. See the Windows step below for why it's mandatory
            # there.
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$PY314T" \
              -DPython3_EXECUTABLE="$PY314T" \
              -DPython_FIND_STRATEGY=LOCATION \
              -DPython3_FIND_STRATEGY=LOCATION \
              -Dpybind11_DIR="${PYBIND11_DIR}" \
              -DCMAKE_CXX_FLAGS="-DPy_GIL_DISABLED=1"
          else
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
          fi
          micromamba run -n bindgen cmake --build build -j 2 -- -k 0
          rm -rf build/CMakeFiles

      - name: Compile (Mac)
        if: inputs.platform == 'OSX'
        run: |
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            PYBIND11_DIR=$("$PY314T" -c "import pybind11; print(pybind11.get_cmake_dir())")
            # Same defensive define as Linux above - not currently required
            # but harmless if redundant, guards against future changes.
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$PY314T" \
              -DPython3_EXECUTABLE="$PY314T" \
              -DPython_FIND_STRATEGY=LOCATION \
              -DPython3_FIND_STRATEGY=LOCATION \
              -Dpybind11_DIR="${PYBIND11_DIR}" \
              -DCMAKE_CXX_FLAGS="-DPy_GIL_DISABLED=1"
          else
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
          fi
          micromamba run -n bindgen cmake --build build -j 2 -- -k 0
          rm -rf build/CMakeFiles

      - name: Compile (Windows)
        if: inputs.platform == 'Windows'
        shell: powershell
        run: |
          # PowerShell 5.1 does NOT stop the script or fail the step when a
          # native command (cmake, ninja, etc.) exits non-zero - it just
          # keeps going, which previously let a failed configure/link hide
          # behind the later (always-succeeding) cleanup command. Check
          # $LASTEXITCODE explicitly after every native invocation instead.
          $ErrorActionPreference = 'Stop'

          # Note: PowerShell interpolation of env vars is different
          if ("${{ matrix.py_min }}" -eq "14t") {
            $pyExe = $env:PY314T
            $pybind11Dir = & $pyExe -c "import pybind11; print(pybind11.get_cmake_dir())"
            # sysconfig's lowercase 'abiflags' is empty for free-threaded Windows
            # builds (only uppercase 'ABIFLAGS' has "t"), which trips up naive
            # name-derivation and produces "python314.lib" instead of
            # "python314t.lib" (see PyO3/maturin#2740). Find the real file on
            # disk instead of trusting anything that re-derives the name.
            $pyLibDir = Join-Path (Split-Path $pyExe) "libs"
            $pyLib = (Get-ChildItem $pyLibDir -Filter "python3*t.lib" | Select-Object -First 1).FullName
            # pyconfig.h only embeds the correct "pythonXXXt.lib" default-
            # library pragma into compiled objects when Py_GIL_DISABLED is
            # defined for the compiler - its own comment states this is
            # expected to be set by "a build backend", not inferred
            # automatically. Without it, every object embeds the wrong,
            # untagged "pythonXXX.lib" regardless of which Python's headers
            # were actually used (confirmed directly by reading pyconfig.h
            # on this machine).
            #
            # /EHsc has been missing from this build regardless (predates
            # the Py_GIL_DISABLED define above - MSVC C4530). Without it,
            # cl.exe still accepts try/catch/throw but won't generate
            # unwind tables for it, which matters for pybind11 since it
            # relies on C++ exceptions unwinding correctly to translate
            # into Python exceptions. Set it explicitly here rather than
            # rely on whatever was (or wasn't) supplying it before.
            micromamba run -n bindgen cmake -B build -S "../$env:OCP_src" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DPython_EXECUTABLE="$pyExe" `
              -DPython3_EXECUTABLE="$pyExe" `
              -DPython_LIBRARY="$pyLib" `
              -DPython3_LIBRARY="$pyLib" `
              -DPython_FIND_STRATEGY=LOCATION `
              -DPython3_FIND_STRATEGY=LOCATION `
              -Dpybind11_DIR="$pybind11Dir" `
              -DCMAKE_CXX_FLAGS="/EHsc /DPy_GIL_DISABLED=1" `
              -DCMAKE_LINKER=lld-link.exe
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }
          } else {
            micromamba run -n bindgen cmake -B build -S "../$env:OCP_src" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DPython3_FIND_STRATEGY=LOCATION `
              -DPython3_ROOT_DIR=$env:CONDA_PREFIX `
              -DCMAKE_LINKER=lld-link.exe
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }
          }
          micromamba run -n bindgen cmake --build build -j $env:NUMBER_OF_PROCESSORS -- -v -k 0
          if ($LASTEXITCODE -ne 0) { throw "cmake --build failed (exit $LASTEXITCODE)" }

          $pyd = Get-ChildItem build -Filter "OCP.*.pyd" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pyd) { throw "cmake --build reported success but no OCP.*.pyd was produced - this is a real build failure" }

          # PyInstaller-bundled apps ship their own interpreter alongside
          # whatever modules they carry, so there's no ambiguity a version
          # tag would guard against - provide a plain-named copy for that
          # kind of downstream use, without touching the tagged original
          # (still used by the wheel-building step below).
          if ($pyd.Name -ne "OCP.pyd") {
            Copy-Item $pyd.FullName (Join-Path $pyd.Directory "OCP.pyd") -Force
          }

          micromamba run -n bindgen cmake -E rm -rf build\CMakeFiles
        env:
          CXX: "cl.exe"

      - name: Upload Compilation Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OCP_${{ inputs.platform }}_py3${{ matrix.py_min }}
          path: build

      - name: Copy dependency DLLs next to OCP.pyd (Windows)
        if: inputs.platform == 'Windows' && matrix.py_min == '14t'
        run: |
          # os.add_dll_directory() (tried first) did not actually resolve
          # OCP's DLL dependencies despite pointing at the right directory
          # and running without error - confirmed by reproducing the
          # failure locally on this same runner/build/interpreter with it
          # active the whole time. Colocating the DLLs next to OCP.pyd
          # instead is unconditional: "the directory containing the DLL
          # being loaded" is always searched first by Windows regardless
          # of any add_dll_directory/trusted-locations state - confirmed
          # fixing the same local reproduction. python314t.dll itself
          # doesn't need copying - it's already resident in the process by
          # the time OCP.pyd loads (python.exe depends on it directly),
          # confirmed by the same local test succeeding without it here.
          LIBDIR=$(cygpath -u "$CONDA_BINDGEN_PREFIX/Library/bin")
          cp "$LIBDIR/"*.dll build/

      - name: Generate stubs
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            "$PY314T" -m pybind11_stubgen -o . OCP
          else
            micromamba run -n bindgen python -m pybind11_stubgen -o . OCP
          fi
          cp -r "../../${OCP_src}" ../upload
          cp -r OCP-stubs ../upload/

      - name: Upload Stubs Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OCP_src_stubs_${{ inputs.platform }}_py3${{ matrix.py_min }}
          path: upload

      - name: Test Import
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            "$PY314T" -c "import OCP; import sys; print(f'Python: {sys.version}'); print(f'GIL enabled: {sys._is_gil_enabled()}')"
          else
            micromamba run -n bindgen -e LD_DEBUG=libs python -c"import OCP"
          fi

      - name: Run tests
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            "$PY314T" -m pytest ../tests
          else
            micromamba run -n bindgen python -m pytest ../tests
          fi

      - name: Build Wheel (Ubuntu)
        if: inputs.platform == 'Linux' && matrix.py_min == '14t'
        run: |
          "$PY314T" -m pip install --upgrade wheel setuptools auditwheel patchelf
          rm -rf wheel_staging dist wheelhouse
          mkdir -p wheel_staging
          cp build/OCP.*.so wheel_staging/
          cp -r build/OCP-stubs wheel_staging/OCP-stubs
          "$PY314T" setup.py bdist_wheel
          # auditwheel's --plat no longer accepts a plain non-manylinux tag
          # like "linux_x86_64" (only "auto" or a manylinux_* policy name) -
          # let it auto-detect the right manylinux policy to actually bundle
          # the shared libs, then retag the result back down to the plain
          # linux_x86_64 tag we want (this wheel isn't manylinux-compliant,
          # it's for internal use only).
          LD_LIBRARY_PATH="$CONDA_BINDGEN_PREFIX/lib:$LD_LIBRARY_PATH" "$PY314T" -m auditwheel repair --plat auto -w wheelhouse dist/*.whl
          "$PY314T" -m wheel tags --platform-tag=linux_x86_64 --remove wheelhouse/*.whl

      - name: Build Wheel (Mac)
        if: inputs.platform == 'OSX' && matrix.py_min == '14t'
        run: |
          "$PY314T" -m pip install --upgrade wheel setuptools delocate
          rm -rf wheel_staging dist wheelhouse
          mkdir -p wheel_staging
          cp build/OCP.*.so wheel_staging/
          cp -r build/OCP-stubs wheel_staging/OCP-stubs
          "$PY314T" setup.py bdist_wheel
          DYLD_LIBRARY_PATH="$CONDA_BINDGEN_PREFIX/lib:$DYLD_LIBRARY_PATH" "$PY314T" -m delocate.cmd.delocate_wheel -w wheelhouse dist/*.whl

      - name: Build Wheel (Windows)
        if: inputs.platform == 'Windows' && matrix.py_min == '14t'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PY314T -m pip install --upgrade wheel setuptools delvewheel
          if ($LASTEXITCODE -ne 0) { throw "pip install failed (exit $LASTEXITCODE)" }
          Remove-Item -Recurse -Force wheel_staging, dist, wheelhouse -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force wheel_staging | Out-Null
          Copy-Item build\OCP.*.pyd wheel_staging\
          Copy-Item -Recurse build\OCP-stubs wheel_staging\OCP-stubs
          & $env:PY314T setup.py bdist_wheel
          if ($LASTEXITCODE -ne 0) { throw "bdist_wheel failed (exit $LASTEXITCODE)" }
          $condaLib = "$env:CONDA_BINDGEN_PREFIX\Library\bin"
          $wheelPath = (Get-Item dist\*.whl).FullName
          & $env:PY314T -m delvewheel repair --add-path "$condaLib" -w wheelhouse "$wheelPath"
          if ($LASTEXITCODE -ne 0) { throw "delvewheel repair failed (exit $LASTEXITCODE)" }

      - name: Upload Wheel
        if: matrix.py_min == '14t'
        uses: actions/upload-artifact@v7
        with:
          name: OCP_wheel_${{ inputs.platform }}_py3${{ matrix.py_min }}
          path: wheelhouse/*.whl

      - name: Build Conda Package
        if: matrix.py_min != '14t' && env.ANACONDA_TOKEN != ''
        env:
          BUILD_STRING: "1"
          TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          # Install build tools in a fresh env
          micromamba create -n build -y -c conda-forge python=3.11 liblief=0.14.1 conda-build anaconda-client
          
          # Determine flags based on event
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Building for PR..."
            micromamba run -n build conda build -c conda-forge --override-channels conda
          else
            echo "Building and Uploading..."
            micromamba run -n build conda build --token $TOKEN --user cadquery --label dev -c conda-forge --override-channels conda
          fi
