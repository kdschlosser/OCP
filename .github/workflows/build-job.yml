name: Generate sources and compile

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      runner_generate:
        required: true
        type: string
      runner_compile:
        required: true
        type: string
      platform:
        required: true
        type: string
    secrets:
      ANACONDA_TOKEN:
        required: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Run pywrap and generate sources
  generate:
    name: Generate ${{ inputs.name }}
    runs-on: ${{ inputs.runner_generate }}
    timeout-minutes: 360
    outputs:
      output_dir: ${{ steps.conf.outputs.OUTPUT }}
    
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read output dir
        id: conf
        run: |
          OUTPUT=$(grep '^output_folder' ocp.toml | sed -E 's/output_folder *= *"(.*)"/\1/')
          echo "OUTPUT=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Cache generated bindings
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.conf.outputs.OUTPUT }}
            ${{ steps.conf.outputs.OUTPUT }}_pkl
          key: ocp-src-${{ inputs.platform }}-${{ hashFiles('opencascade/**', 'ocp.toml', 'CMakeLists.txt', 'templates/**', 'OCP_specific.inc', 'pystreambuf.h', 'dump_symbols.py', 'environment.devenv.yml', 'pywrap/**') }}

      - uses: ./.github/actions/micromamba
        if: steps.cache-src.outputs.cache-hit != 'true'

      - name: SDK install and symlink (Mac)
        if: steps.cache-src.outputs.cache-hit != 'true' && contains(inputs.runner_generate, 'mac')
        run: |
          curl -L -O https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
          sudo mkdir -p /opt
          sudo tar -xf MacOSX11.3.sdk.tar.xz -C /opt
          sudo mkdir -p /opt/usr/local/
          sudo ln -s /opt/MacOSX11.3.sdk/usr/include /opt/usr/local/include
          sudo mkdir -p /usr/local/include
          sudo ln -s /opt/MacOSX11.3.sdk/System/Library/Frameworks/OpenGL.framework/Headers /usr/local/include/OpenGL

      - name: install conda-devenv
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: micromamba install mamba conda-devenv

      - name: Prepare conda environment (mamba-devenv)
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          export CONDA_DEVENV_ENV_MANAGER=mamba
          micromamba create -n bindgen
          env
          micromamba run mamba info
          micromamba run mamba-devenv -f environment.devenv.yml

      - name: Generate (Windows on Linux)
        if: steps.cache-src.outputs.cache-hit != 'true' && inputs.platform == 'Windows'
        run: |
          micromamba create --yes --platform win-64 --no-deps --prefix ./occt "occt=8.0.0=novtk*"
          micromamba run -n bindgen cmake -S . -B . -G Ninja \
            -DPython_ROOT_DIR=$CONDA_PREFIX \
            -DPython3_ROOT_DIR=$CONDA_PREFIX \
            -DPython_FIND_VIRTUALENV=ONLY \
            -DPython3_FIND_VIRTUALENV=ONLY \
            -DOCCT_LIB_DIR=./occt/Library/bin/ \
            -DPLATFORM=Windows
          cmake --build . -- -v
          ls -lRht

      - name: Generate (Standard)
        if: steps.cache-src.outputs.cache-hit != 'true' && inputs.platform != 'Windows'
        run: |
          micromamba run -n bindgen cmake -S . -B . -G Ninja \
            -DPython_ROOT_DIR=$CONDA_PREFIX \
            -DPython3_ROOT_DIR=$CONDA_PREFIX \
            -DPython_FIND_VIRTUALENV=ONLY \
            -DPython3_FIND_VIRTUALENV=ONLY
          cmake --build .
          ls -lRht

      - name: Copy pkl output
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ steps.conf.outputs.OUTPUT }}_pkl
          cp *.pkl ${{ steps.conf.outputs.OUTPUT }}_pkl/
          cp *.dat ${{ steps.conf.outputs.OUTPUT }}_pkl/

      - name: Upload Sources
        uses: actions/upload-artifact@v7
        with:
          name: OCP_src_${{ inputs.platform }}
          path: ${{ steps.conf.outputs.OUTPUT }}

      - name: Upload Pickles
        uses: actions/upload-artifact@v7
        with:
          name: OCP_pkl_${{ inputs.platform }}
          path: ${{ steps.conf.outputs.OUTPUT }}_pkl

  # Compile
  compile:
    needs: generate
    name: Compile ${{ inputs.name }} (3.${{ matrix.py_min }})
    runs-on: ${{ inputs.runner_compile }}
    strategy:
      fail-fast: false
      matrix:
        py_min: ['14t']

    env:
      OCP_src: OCP_src_${{ inputs.platform }}
      n_cores: 2
      PYTHON_VERSION: 3.${{ matrix.py_min }}
      STAGE: "compile"
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download Source Artifact
        uses: actions/download-artifact@v8
        with:
          name: OCP_src_${{ inputs.platform }}
          path: ../${{ env.OCP_src }}

      - name: Set up Python 3.14t (free-threaded)
        if: matrix.py_min == '14t'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Install pybind11 3.x and test/stub deps into 3.14t
        if: matrix.py_min == '14t'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pybind11>=3.0.2" pytest git+https://github.com/CadQuery/pybind11-stubgen.git

      - uses: ./.github/actions/micromamba

      - name: install conda-devenv
        run: micromamba install mamba conda-devenv

      - name: Prepare conda environment (mamba-devenv)
        if: matrix.py_min != '14t'
        run: |
          export CONDA_DEVENV_ENV_MANAGER=mamba
          micromamba create -n bindgen
          micromamba run mamba-devenv -f environment.devenv.yml

      - name: Prepare conda environment (C++ deps only, no VTK, no Python)
        if: matrix.py_min == '14t'
        run: |
          export CONDA_DEVENV_ENV_MANAGER=mamba
          micromamba create -n bindgen
          micromamba run mamba-devenv -f environment.devenv.14t.yml

      - name: Compile (Ubuntu)
        if: contains(inputs.runner_compile, 'ubuntu')
        run: |
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            PYBIND11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$(which python)" \
              -DPython3_EXECUTABLE="$(which python)" \
              -DPython_FIND_STRATEGY=LOCATION \
              -DPython3_FIND_STRATEGY=LOCATION \
              -Dpybind11_DIR="${PYBIND11_DIR}"
          else
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
          fi
          micromamba run -n bindgen cmake --build build -j 2 -- -k 0
          rm -rf build/CMakeFiles

      - name: Compile (Mac)
        if: contains(inputs.runner_compile, 'mac')
        run: |
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            PYBIND11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython_EXECUTABLE="$(which python)" \
              -DPython3_EXECUTABLE="$(which python)" \
              -DPython_FIND_STRATEGY=LOCATION \
              -DPython3_FIND_STRATEGY=LOCATION \
              -Dpybind11_DIR="${PYBIND11_DIR}"
          else
            micromamba run -n bindgen cmake -B build -S "../${OCP_src}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
          fi
          micromamba run -n bindgen cmake --build build -j 2 -- -k 0
          rm -rf build/CMakeFiles

      - name: Compile (Windows)
        if: contains(inputs.runner_compile, 'windows')
        shell: powershell
        run: |
          # Note: PowerShell interpolation of env vars is different
          if ("${{ matrix.py_min }}" -eq "14t") {
            $pyExe = (Get-Command python).Source
            $pybind11Dir = & $pyExe -c "import pybind11; print(pybind11.get_cmake_dir())"
            micromamba run -n bindgen cmake -B build -S "../$env:OCP_src" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DPython_EXECUTABLE="$pyExe" `
              -DPython3_EXECUTABLE="$pyExe" `
              -DPython_FIND_STRATEGY=LOCATION `
              -DPython3_FIND_STRATEGY=LOCATION `
              -Dpybind11_DIR="$pybind11Dir" `
              -DCMAKE_LINKER=lld-link.exe
          } else {
            micromamba run -n bindgen cmake -B build -S "../$env:OCP_src" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DPython3_FIND_STRATEGY=LOCATION `
              -DPython3_ROOT_DIR=$env:CONDA_PREFIX `
              -DCMAKE_LINKER=lld-link.exe
          }
          micromamba run -n bindgen cmake --build build -j 1 -- -v -k 0
          micromamba run -n bindgen cmake -E rm -rf build\CMakeFiles
        env:
          CXX: "cl.exe"

      - name: Upload Compilation Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OCP_${{ inputs.platform }}_py3${{ matrix.py_min }}
          path: build

      - name: Generate stubs
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            python -m pybind11_stubgen -o . OCP
          else
            micromamba run -n bindgen python -m pybind11_stubgen -o . OCP
          fi
          cp -r "../../${OCP_src}" ../upload
          cp -r OCP-stubs ../upload/

      - name: Upload Stubs Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OCP_src_stubs_${{ inputs.platform }}_py3${{ matrix.py_min }}
          path: upload

      - name: Test Import
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            python -c "import OCP; import sys; print(f'Python: {sys.version}'); print(f'GIL enabled: {sys._is_gil_enabled()}')"
          else
            micromamba run -n bindgen -e LD_DEBUG=libs python -c"import OCP"
          fi

      - name: Run tests
        run: |
          cd build
          if [ "${{ matrix.py_min }}" == "14t" ]; then
            python -m pytest ../tests
          else
            micromamba run -n bindgen python -m pytest ../tests
          fi

      - name: Build Conda Package
        if: matrix.py_min != '14t' && env.ANACONDA_TOKEN != ''
        env:
          BUILD_STRING: "1"
          TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          # Install build tools in a fresh env
          micromamba create -n build -y -c conda-forge python=3.11 liblief=0.14.1 conda-build anaconda-client
          
          # Determine flags based on event
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Building for PR..."
            micromamba run -n build conda build -c conda-forge --override-channels conda
          else
            echo "Building and Uploading..."
            micromamba run -n build conda build --token $TOKEN --user cadquery --label dev -c conda-forge --override-channels conda
          fi
